name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Honors rust-toolchain.toml (pinned channel, rustfmt + clippy).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p discky-app
      # Regenerates the app icon (checks iconutil on macos-15); a stale committed icon fails.
      - run: cargo xtask icon
      - run: git diff --exit-code assets/
      # `cargo xtask bundle` stays out of CI: it needs a codesigning identity.
