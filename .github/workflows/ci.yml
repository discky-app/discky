name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Honors rust-toolchain.toml (pinned channel, rustfmt + clippy).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p discky-app
      # Regenerates the app icon (smoke-tests iconutil on macos-15). Only logo.png is
      # byte-checked: iconutil's .icns bytes may differ between macOS versions.
      - run: cargo xtask icon
      - run: git diff --exit-code assets/logo.png
      - run: test -s assets/AppIcon.icns
      # `cargo xtask bundle` stays out of CI: it needs a codesigning identity.
